# A table of 3-byte entries at 0x8061EC28, indexed from 1: the compiler folds the -1 into the base
# (lis/addi of 0x8061EC25). Without this dtk makes a symbol at the odd address and cannot split.
- source: .text:0x802C6358
  type: ha
  target: lbl_8061EC28
  addend: -3
- source: .text:0x802C635C
  type: l
  target: lbl_8061EC28
  addend: -3
# The entry code clears .sbss up to its end (0x806EFC40, where .sdata2 starts). dtk names the low
# half after the CodeWarrior linker symbol _stack_end, which SN's link script does not define.
- source: .init:0x80003160
  type: l
  target: lbl_806EFC40
