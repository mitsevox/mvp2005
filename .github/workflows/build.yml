name: Build

on:
  push:
  pull_request:
  # A manual run on main republishes a fresh measurement to the shared site.
  workflow_dispatch:

# Builds of main queue up; newer pushes to any other branch cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # The shared site's producer policy names this job, "build (GV4E69)" (also main's required
    # check), and the steps below (config/GV4E69/producer.json, docs/public_report.md): renaming
    # one is a policy change.
    # A *private* build container holding only the game's main.dol (mitsevox/mvp2005-build).
    # See docs/github_actions.md for more information.
    container: ghcr.io/mitsevox/mvp2005-build:main

    runs-on: ubuntu-latest
    # A normal build takes about a minute; fail a hung compile fast instead of after 6 hours.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read      # the private build container
    strategy:
      fail-fast: false
      matrix:
        # Add game versions here
        version: [GV4E69]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -a /orig .

    # No build cache: every run compiles and measures from scratch, so the published report never
    # rests on an earlier run's objects (the shared wiki's fresh-validation rule).

    # Build the project. `progress` depends on the main.dol hash check, so this fails unless the
    # build is byte-identical.
    - name: Build and verify main.dol
      run: |
        # The container's compiler and binutils packages can be older than this project's pinned
        # versions, so configure.py downloads its own, the same as a local build (tw2004's lesson).
        python configure.py --map --version ${{ matrix.version }}
        ninja all_source progress build/${{ matrix.version }}/report.json
        echo "MEASURED_AT=$(python tools/public_report.py now)" >> "$GITHUB_ENV"

    # The shared site's report-v1 inputs, from the report.json just measured
    - name: Export public report inputs
      run: |
        python tools/public_report.py inputs --report build/${{ matrix.version }}/report.json \
            --output build/public-input
        python tools/public_report.py metadata --version ${{ matrix.version }} \
            --measured-at "$MEASURED_AT" --output build/public-metadata.json

    # The site's own packager, at a pinned revision, builds and validates the package
    - name: Fetch pinned site packager
      uses: actions/checkout@v4
      with:
        repository: mitsevox/mitsevox.github.io
        ref: 83fa7350997affb95e3e585b52d0be0a9718f807
        path: build/site-tools
        persist-credentials: false

    - name: Package and validate public report
      run: |
        cd build/site-tools
        uv run --locked python tools/package_report.py \
            --input ../public-input \
            --metadata ../public-metadata.json \
            --policy ../../config/${{ matrix.version }}/producer.json \
            --output ../public-report

    # Upload map files
    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

    # The shared site imports this from main runs only (public JSON, no game bytes)
    - name: Upload public report
      uses: actions/upload-artifact@v4
      with:
        name: public-report
        path: build/public-report/
        if-no-files-found: error
